<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniStudy - პერსონალიზებული AI პლანერი და სასწავლო ჰაბი</title>
  
  <!-- Noto Sans Georgian and Noto Sans Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;500;600;700;800&family=Noto+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React, ReactDOM & Babel for in-browser JSX compilation -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- PDF.js & Mammoth.js for client-side PDF and DOCX text extraction -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <style>
    :root {
      --bg-primary: #f0f9ff;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f8fafc;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-light: #e0f2fe;
      --primary-subtle: #f0f9ff;
      --text-main: #0f172a;
      --text-medium: #334155;
      --text-muted: #64748b;
      --text-white: #ffffff;
      --border: #e2e8f0;
      --border-light: #f1f5f9;
      --border-focus: #bae6fd;
      --success: #10b981;
      --success-light: #d1fae5;
      --warning: #f59e0b;
      --warning-light: #fef3c7;
      --danger: #ef4444;
      --danger-light: #fee2e2;
      --info: #3b82f6;
      --info-light: #dbeafe;
      --font-sans: 'Noto Sans Georgian', 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 20px -2px rgba(2, 132, 199, 0.06), 0 2px 10px -1px rgba(0, 0, 0, 0.03);
      --shadow-lg: 0 10px 30px -5px rgba(2, 132, 199, 0.1), 0 4px 15px -2px rgba(0, 0, 0, 0.05);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --transition-fast: 0.15s ease;
      --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: var(--radius-full);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: var(--shadow-md);
      border-radius: var(--radius-lg);
      transition: transform var(--transition-normal), box-shadow var(--transition-normal);
    }

    .glass-panel-hover:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(2, 132, 199, 0.15);
    }

    .app-container {
      display: flex;
      min-height: 100vh;
    }

    .content-area {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    button {
      font-family: var(--font-sans);
      cursor: pointer;
    }

    input, textarea, select {
      font-family: var(--font-sans);
    }

    .btn-primary {
      background: var(--primary);
      color: var(--text-white);
      border: none;
      padding: 12px 24px;
      font-weight: 500;
      border-radius: var(--radius-md);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.3);
    }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--primary);
      border: 1.5px solid var(--primary-light);
      padding: 12px 24px;
      font-weight: 500;
      border-radius: var(--radius-md);
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    .btn-secondary:hover {
      background: var(--primary-subtle);
      border-color: var(--primary);
    }

    .input-field {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      color: var(--text-main);
      transition: all var(--transition-fast);
    }

    .input-field:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--border-focus);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-success { background: var(--success-light); color: var(--success); }
    .badge-warning { background: var(--warning-light); color: var(--warning); }
    .badge-danger { background: var(--danger-light); color: var(--danger); }
    .badge-info { background: var(--info-light); color: var(--info); }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }

    /* Sidebar Layout */
    .sidebar {
      width: 280px;
      height: calc(100vh - 40px);
      position: sticky;
      top: 20px;
      left: 20px;
      margin: 20px 0 20px 20px;
      display: flex;
      flex-direction: column;
      padding: 24px;
      z-index: 100;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(2, 132, 199, 0.1);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
    }

    .logo-icon-box {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--primary) 0%, #38bdf8 100%);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .logo-text {
      font-size: 1.35rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: transparent;
      border: none;
      color: var(--text-medium);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 500;
      width: 100%;
      text-align: left;
      transition: all var(--transition-fast);
      position: relative;
    }

    .nav-item:hover {
      background: var(--primary-subtle);
      color: var(--primary);
    }

    .nav-item.active {
      background: var(--primary-light);
      color: var(--primary-hover);
      font-weight: 600;
    }

    .active-indicator {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 20px;
      background: var(--primary);
      border-radius: var(--radius-full) 0 0 var(--radius-full);
    }

    .sidebar-footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .user-profile-capsule {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      border: 1px solid var(--border-focus);
    }

    .user-info {
      overflow: hidden;
    }

    .user-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .user-email {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .logout-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      width: 100%;
      border: 1.5px solid var(--danger-light);
      background: transparent;
      color: var(--danger);
      font-weight: 500;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      transition: all var(--transition-fast);
    }

    .logout-btn:hover {
      background: var(--danger-light);
    }

    /* Pages Layouts */
    /* Landing page */
    .landing-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 10% 20%, rgba(224, 242, 254, 0.4) 0%, rgba(255, 255, 255, 1) 90%);
      padding: 0 40px;
    }
    .landing-header {
      padding: 30px 0;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }
    .landing-main {
      flex: 1;
      display: flex;
      align-items: center;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 0 80px 0;
    }
    .hero-section {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 60px;
      align-items: center;
      width: 100%;
    }
    .hero-content h1 {
      font-size: 2.85rem;
      line-height: 1.25;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }
    .hero-subtitle {
      font-size: 1.1rem;
      color: var(--text-medium);
      margin-bottom: 40px;
      line-height: 1.7;
    }
    .features-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .feature-card {
      padding: 24px;
      border-radius: var(--radius-md);
    }
    .feature-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .feature-card p {
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    .auth-card {
      padding: 40px 32px;
      background: white;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(2, 132, 199, 0.05);
      box-shadow: 0 20px 40px rgba(2, 132, 199, 0.08);
    }
    .auth-card h2 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .auth-card-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 30px;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-group label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-medium);
    }
    .auth-submit-btn {
      width: 100%;
      padding: 14px;
      font-size: 0.98rem;
    }

    /* Dashboard */
    .dashboard-container {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    .dashboard-header-greeting h1 {
      font-size: 2.1rem;
      font-weight: 800;
    }
    .dashboard-header-greeting .subtitle {
      color: var(--text-muted);
    }
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 30px;
    }
    .dashboard-card {
      padding: 26px;
      background: #ffffff;
      border-radius: var(--radius-lg);
    }
    .dashboard-card h2 {
      font-size: 1.15rem;
      margin-bottom: 20px;
    }
    .progress-visualization {
      display: flex;
      align-items: center;
      gap: 30px;
      justify-content: center;
    }
    .radial-bg {
      fill: none;
      stroke: var(--border-light);
    }
    .radial-fill {
      fill: none;
      stroke: var(--primary);
      transition: stroke-dashoffset 0.6s ease;
    }
    .radial-text {
      font-size: 1.6rem;
      font-weight: 800;
      fill: var(--text-main);
    }
    .progress-details {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }
    .stat-item {
      display: flex;
      justify-content: space-between;
      border-bottom: 1.5px solid var(--border-light);
      padding-bottom: 6px;
      font-size: 0.92rem;
    }
    .coaches-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .coach-bubble {
      border-radius: var(--radius-md);
      padding: 16px;
      border: 1px solid var(--border-light);
    }
    .coach-bubble.heart { background: #fdf2f8; border-color: #fce7f3; }
    .coach-bubble.brain { background: #f0fdf4; border-color: #dcfce7; }
    .coach-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .coach-badge.heart { background: #fce7f3; color: #db2777; }
    .coach-badge.brain { background: #dcfce7; color: #16a34a; }
    .coach-message {
      font-size: 0.88rem;
      font-style: italic;
      color: var(--text-medium);
    }
    .tasks-section-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 30px;
    }
    .tasks-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 380px;
      overflow-y: auto;
    }
    .task-row {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      background: var(--bg-tertiary);
    }
    .task-row.done {
      opacity: 0.7;
    }
    .task-toggle-btn {
      background: transparent;
      border: none;
      margin-right: 12px;
      display: flex;
      align-items: center;
    }
    .task-body {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .task-text {
      font-size: 0.95rem;
      font-weight: 500;
    }
    .task-row.done .task-text {
      text-decoration: line-through;
    }
    .task-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .task-delete-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 6px;
    }
    .task-delete-btn:hover {
      color: var(--danger);
    }
    .add-task-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-row {
      display: flex;
      gap: 16px;
    }

    /* Time Manager */
    .planner-layout {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 30px;
    }
    .goal-textarea {
      resize: none;
      min-height: 120px;
    }
    .plan-result-card {
      padding: 30px;
      background: white;
    }
    .plan-result-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }
    .plan-summary-box {
      background: #f0fdf4;
      border: 1px solid #dcfce7;
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 26px;
      font-size: 0.88rem;
    }
    .plan-tabs {
      display: flex;
      border-bottom: 1.5px solid var(--border);
      gap: 16px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 12px 6px;
      border: none;
      background: transparent;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }
    .pomodoro-item {
      display: flex;
      justify-content: space-between;
      padding: 16px;
      border: 1px solid var(--border-light);
      background: var(--bg-tertiary);
      border-radius: var(--radius-md);
      margin-bottom: 10px;
    }
    .time-block-calendar {
      display: flex;
      flex-direction: column;
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-md);
    }
    .calendar-block {
      display: flex;
      border-bottom: 1px solid var(--border-light);
    }
    .block-time {
      width: 110px;
      padding: 14px;
      background: var(--bg-tertiary);
      border-right: 1.5px solid var(--border-light);
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
    }
    .block-activity {
      padding: 14px 20px;
      font-size: 0.9rem;
    }
    .eisenhower-matrix-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .matrix-quadrant {
      padding: 20px;
      border-radius: var(--radius-md);
      min-height: 120px;
    }
    .matrix-quadrant.q1 { background: #fee2e2; color: #991b1b; }
    .matrix-quadrant.q2 { background: #fef3c7; color: #92400e; }
    .matrix-quadrant.q3 { background: #e0f2fe; color: #075985; }
    .matrix-quadrant.q4 { background: #f1f5f9; color: #334155; }
    .quadrant-title {
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .quadrant-list {
      list-style: none;
      font-size: 0.85rem;
    }

    /* Study Hub */
    .study-hub-layout {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 30px;
    }
    .file-drop-zone {
      border: 2px dashed var(--border-focus);
      background: var(--bg-primary);
      border-radius: var(--radius-md);
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
    }
    .divider-or {
      text-align: center;
      margin: 20px 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .loaded-document-card {
      padding: 26px;
      background: white;
      border-radius: var(--radius-lg);
    }
    .doc-actions-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 20px 0;
    }
    .doc-action-btn {
      padding: 12px 16px;
      border: 1px solid var(--border-light);
      background: var(--bg-tertiary);
      border-radius: var(--radius-md);
      font-weight: 600;
      width: 100%;
      text-align: left;
    }
    .doc-action-btn.active {
      background: var(--primary);
      color: white;
    }
    .workspace-card {
      padding: 26px;
      background: white;
      border-radius: var(--radius-lg);
      min-height: 500px;
    }
    .chat-messages-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 380px;
      overflow-y: auto;
      margin-bottom: 20px;
    }
    .chat-bubble-row {
      display: flex;
      gap: 12px;
      max-width: 85%;
    }
    .chat-bubble-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .chat-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .chat-bubble-row.assistant .chat-avatar { background: var(--primary-light); color: var(--primary); }
    .chat-bubble-row.user .chat-avatar { background: var(--border-focus); color: var(--primary-hover); }
    .chat-bubble-text {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
    }
    .chat-bubble-row.assistant .chat-bubble-text { background: var(--bg-tertiary); }
    .chat-bubble-row.user .chat-bubble-text { background: var(--primary); color: white; }
    .chat-input-bar {
      display: flex;
      gap: 10px;
    }

    /* Quiz styling */
    .quiz-options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }
    .quiz-option-btn {
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      background: white;
      border-radius: var(--radius-sm);
      text-align: left;
      width: 100%;
    }
    .quiz-option-btn.selected {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    async function callGeminiAPI(prompt, systemInstruction, apiKey) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined,
          generationConfig: { temperature: 0.2, maxOutputTokens: 2048 }
        })
      });
      if (!response.ok) throw new Error("API request failed");
      const data = await response.json();
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) throw new Error("empty response");
      return text;
    }

    // ==========================================
    // COMPONENT: DASHBOARD
    // ==========================================
    function Dashboard({ tasks, setTasks, apiKey }) {
      const [newTaskText, setNewTaskText] = React.useState('');
      const [newTaskPriority, setNewTaskPriority] = React.useState('medium');
      const [heartFeedback, setHeartFeedback] = React.useState('გამარჯობა! მე შენი აკადემიური ქოუჩი ვარ. მზად ხარ დღევანდელი მიზნების მისაღწევად? ✨');
      const [brainFeedback, setBrainFeedback] = React.useState('ანალიზი: დავალებები შესასრულებელია. დროის ეფექტური ბლოკირებისთვის გამორთეთ სოციალური ქსელები.');

      const totalTasks = tasks.length;
      const completedTasks = tasks.filter(t => t.done).length;
      const progressPercent = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

      const strokeDashoffset = 2 * Math.PI * 60 - (progressPercent / 100) * (2 * Math.PI * 60);

      const handleAddTask = (e) => {
        e.preventDefault();
        if (!newTaskText.trim()) return;
        const newTask = {
          id: Date.now().toString(),
          text: newTaskText,
          priority: newTaskPriority,
          done: false
        };
        setTasks([newTask, ...tasks]);
        setNewTaskText('');

        // Mock coach text adjustment on adding task
        setHeartFeedback("ახალი მიზანი დასახულია! მჯერა, რომ წარმატებით გაართმევ თავს. ნაბიჯ-ნაბიჯ მიყევი გეგმას! 💙");
        setBrainFeedback("ანალიზი: დავალებების რიცხვი გაიზარდა. შეინარჩუნეთ ფოკუსი და პრიორიტეტი მიანიჭეთ Q1 კატეგორიას.");
      };

      const toggleTask = (id) => {
        const updated = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
        setTasks(updated);
        
        const completed = updated.filter(t => t.done).length;
        const newProgress = updated.length > 0 ? Math.round((completed / updated.length) * 100) : 0;
        
        if (newProgress >= 70) {
          setHeartFeedback("საოცარი პროგრესია! შენი მონდომება დღეს განსაკუთრებულია. ასე გააგრძელე! 🎉");
          setBrainFeedback("ანალიზი: შესრულებულია 70%-ზე მეტი. დროის მენეჯმენტი სტატისტიკურად წარმატებულია.");
        } else if (newProgress > 0) {
          setHeartFeedback("მშვენიერი დასაწყისია! პირველი ნაბიჯები გადადგმულია, სწორი მიმართულებით მიდიხარ. ✨");
          setBrainFeedback("ანალიზი: პროგრესი დაიწყო. გააგრძელეთ მუშაობა Time-Blocking გრაფიკით.");
        }
      };

      const deleteTask = (id) => {
        setTasks(tasks.filter(t => t.id !== id));
      };

      return (
        <div className="dashboard-container animate-fade-in">
          <div className="dashboard-header-greeting">
            <h1>სტუდენტის მთავარი დაფა</h1>
            <p className="subtitle">აკონტროლე შენი პროგრესი, დაგეგმე დღე და მიიღე AI რეკომენდაციები.</p>
          </div>

          <div className="dashboard-grid">
            <div className="dashboard-card glass-panel progress-card">
              <h2>მიმდინარე პროგრესი</h2>
              <div className="progress-visualization">
                <svg width="150" height="150" viewBox="0 0 150 150">
                  <circle className="radial-bg" cx="75" cy="75" r="60" strokeWidth="10"/>
                  <circle 
                    className="radial-fill" 
                    cx="75" 
                    cy="75" 
                    r="60" 
                    strokeWidth="10" 
                    strokeDasharray={2 * Math.PI * 60}

            სტრუქტურა:
            {
              "summary": "შეფასება",

              "eisenhower": { "q1": ["სასწრაფო"], "q2": ["მნიშვნელოვანი"], "q3": ["არა კრიტიკული"], "q4": ["არაფრისმომცემი"] }
            }
            დააბრუნე მხოლოდ JSON.`;
            const text = await callGeminiAPI(goal, system, apiKey);
            const parsed = JSON.parse(text.replace(/```json/g, '').replace(/```/g, '').trim());

    function StudyHub({ apiKey }) {
      const [text, setText] = React.useState('');
      const [fileName, setFileName] = React.useState('');
      const [isLoaded, setIsLoaded] = React.useState(false);
      const [loadingFile, setLoadingFile] = React.useState(false);
      const [errorMsg, setErrorMsg] = React.useState('');
      const [activeTab, setActiveTab] = React.useState('chat'); // 'chat' | 'quiz' | 'podcast'
      
      // Chat states
      const [messages, setMessages] = React.useState([]);
      const [input, setInput] = React.useState('');
      
      // Quiz States
      const [quiz, setQuiz] = React.useState([]);
      const [answers, setAnswers] = React.useState({});
      const [score, setScore] = React.useState(0);
      const [submitted, setSubmitted] = React.useState(false);

      // Podcast states
      const [podcast, setPodcast] = React.useState([]);
      const [playing, setPlaying] = React.useState(false);
      const [currentLine, setCurrentLine] = React.useState(-1);

      const initWork = () => {
        setMessages([
          { sender: 'assistant', text: 'მასალა წარმატებით ჩაიტვირთა. დამისვით კითხვები მხოლოდ ამ ტექსტზე დაყრდნობით, ან დააგენერირეთ ქვიზები/პოდკასტი.' }
        ]);
        setQuiz([]);
        setAnswers({});
        setSubmitted(false);
        setPodcast([]);
        setPlaying(false);
        setCurrentLine(-1);
      };

      const handleLoadText = () => {
        if (!text.trim()) return;
        setFileName('პასტირებული მასალა');
        setIsLoaded(true);
        initWork();
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        setFileName(file.name);
        setLoadingFile(true);
        setErrorMsg('');
        
        try {
          if (file.name.endsWith('.txt')) {
            const reader = new FileReader();
            reader.onload = (evt) => {
              setText(evt.target.result);
              setIsLoaded(true);
              setLoadingFile(false);
              initWork();
            };
            reader.readAsText(file);
          } else if (file.name.endsWith('.pdf')) {
            const arrayBuffer = await file.arrayBuffer();
            const pdfjsLib = window['pdfjs-dist/build/pdf'];
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            
            let extractedText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const textContent = await page.getTextContent();
              const pageText = textContent.items.map(item => item.str).join(' ');
              extractedText += pageText + '\n';
            }
            
            if (extractedText.trim().length === 0) {
              throw new Error("PDF ფაილიდან ტექსტის ამოღება ვერ მოხერხდა (შესაძლოა სკანირებული სურათია).");
            }
            
            setText(extractedText);
            setIsLoaded(true);
            setLoadingFile(false);
            initWork();
          } else if (file.name.endsWith('.docx')) {
            const arrayBuffer = await file.arrayBuffer();
            const result = await window.mammoth.extractRawText({ arrayBuffer });
            
            if (!result.value || result.value.trim().length === 0) {
              throw new Error("Word დოკუმენტიდან ტექსტი ვერ ამოვიღეთ.");
            }
            
            setText(result.value);
            setIsLoaded(true);
            setLoadingFile(false);
            initWork();
          } else {
            throw new Error("მხარდაჭერილია მხოლოდ .txt, .pdf, და .docx ფაილები.");
          }
        } catch (err) {
          console.error(err);
          setErrorMsg(err.message || "ფაილის წაკითხვისას დაფიქსირდა შეცდომა.");
          setLoadingFile(false);
        }
      };

      const handleSendChat = (e) => {
        e.preventDefault();
        if (!input.trim()) return;

        const userMsg = { sender: 'user', text: input };
        setMessages(prev => [...prev, userMsg]);
        setInput('');

        // Mock RAG logic: find simple substring matches in text
        setTimeout(() => {
          const lowerInput = input.toLowerCase();
          const sentences = text.split(/[.!?\n]/);
          let match = '';
          for (let s of sentences) {
            if (s.trim().length > 5 && s.toLowerCase().includes(lowerInput)) {
              match = s.trim();
              break;
            }
          }

          if (match) {
            setMessages(prev => [...prev, { 
              sender: 'assistant', 
              text: `დოკუმენტში არსებული ინფორმაციით: "${match}." (ეს პასუხი ეყრდნობა მხოლოდ ატვირთულ მასალას).` 
            }]);
          } else {
            setMessages(prev => [...prev, { 
              sender: 'assistant', 
              text: 'სამწუხაროდ, აღნიშნული ინფორმაცია ატვირთულ მასალაში არ იძებნება (ჩემი ძრავა ბლოკავს გარე ფაქტების მოგონებას ჰალუცინაციების თავიდან ასაცილებლად).' 
            }]);
          }
        }, 600);
      };

      const generateQuizData = () => {
        setQuiz([
          {
            id: 1,
            question: "რა არის RAG სისტემის მთავარი დანიშნულება?",
            options: ["მონაცემების შენახვა", "ინფორმაციის მოძიება და პასუხის გაცემა მხოლოდ ატვირთული დოკუმენტიდან ჰალუცინაციების ბლოკირებით", "დიზაინის შექმნა", "პროგრამირების ენის შედგენა"],
            correctAnswer: "ინფორმაციის მოძიება და პასუხის გაცემა მხოლოდ ატვირთული დოკუმენტიდან ჰალუცინაციების ბლოკირებით"
          },
          {
            id: 2,
            question: "რა განასხვავებს Twin-AI Engine-ის ქოუჩს (Heart) მენეჯერისგან (Brain)?",
            options: ["უფრო სწრაფია", "ქოუჩი არის მხარდამჭერი, პოზიტიური და მოტივატორი, ხოლო მენეჯერი არის მკაცრი და რაციონალური", "აკეთებს დავალებებს სტუდენტის ნაცვლად", "არაფერი"],
            correctAnswer: "ქოუჩი არის მხარდამჭერი, პოზიტიური და მოტივატორი, ხოლო მენეჯერი არის მკაცრი და რაციონალური"
          }
        ]);
        setSubmitted(false);
        setAnswers({});
      };

      const submitQuiz = () => {
        let tempScore = 0;
        quiz.forEach(q => {
          if (answers[q.id] === q.correctAnswer) tempScore++;
        });
        setScore(tempScore);
        setSubmitted(true);
      };

      const generatePodcastData = () => {
        setPodcast([
          { speaker: "თამთა", text: "მოგესალმებით მეგობრებო! ეს არის OmniStudy-ის აუდიო-პოდკასტი. დღეს ჩვენს სტუდიაშია ექსპერტი გიორგი, რომელთან ერთადაც განვიხილავთ ატვირთულ მასალას." },
          { speaker: "გიორგი", text: "გამარჯობა თამთა! მოხარული ვარ აქ ყოფნით. ეს მასალა მართლაც ძალიან საინტერესოა და მისი შესწავლა Pomodoro ტექნიკით გაცილებით ეფექტური იქნება." },
          { speaker: "თამთა", text: "დიდი მადლობა, გიორგი, საინტერესო რჩევებისთვის! მეგობრებო, წარმატებულ სწავლას გისურვებთ, მომავალ შეხვედრამდე!" }
        ]);
        setPlaying(false);
        setCurrentLine(-1);
      };

      const playSpeech = (index) => {
        if (index >= podcast.length) {
          setPlaying(false);
          setCurrentLine(-1);
          return;
        }
        setCurrentLine(index);
        const line = podcast[index];
        const utterance = new SpeechSynthesisUtterance(line.text);
        utterance.lang = 'ka-GE';
        
        if (line.speaker === 'თამთა') {
          utterance.pitch = 1.2;
        } else {
          utterance.pitch = 0.9;
        }

        utterance.onend = () => {
          if (playing) playSpeech(index + 1);
        };
        window.speechSynthesis.speak(utterance);
      };

      const togglePlay = () => {
        if (playing) {
          window.speechSynthesis.cancel();
          setPlaying(false);
        } else {
          setPlaying(true);
          playSpeech(currentLine === -1 ? 0 : currentLine);
        }
      };

      React.useEffect(() => {
        if (playing && currentLine !== -1) {
          // Speak current line
          playSpeech(currentLine);

            <p className="subtitle">ატვირთე მასალა და გარდაქმენი ქვიზებად, პოდკასტებად ან დაუსვი კითხვები AI ასისტენტს.</p>
          </div>

          <div className="study-hub-layout">
            <div className="hub-left-panel">
              {!isLoaded ? (
                <div className="loaded-document-card glass-panel" style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <h2>მასალის ჩატვირთვა</h2>
                  
                  {/* Drag and drop input */}
                  <div className="file-drop-zone" style={{ border: '2px dashed var(--border-focus)', padding: '24px', textAlign: 'center', borderRadius: '12px', background: 'var(--bg-primary)' }}>
                    <p style={{ fontWeight: '700', fontSize: '0.88rem' }}>ჩააგდეთ ან აირჩიეთ ფაილი</p>
                    <p style={{ fontSize: '0.75rem', color: 'var(--text-muted)', margin: '6px 0 16px 0' }}>მხარდაჭერილია .txt, .pdf, .docx</p>
                    <input 
                      type="file" 
                      accept=".txt,.pdf,.docx" 
                      onChange={handleFileUpload} 
                      id="standalone-file-input"
                      style={{ display: 'none' }}
                    />
                    <label htmlFor="standalone-file-input" className="btn-secondary" style={{ cursor: 'pointer', padding: '6px 16px', fontSize: '0.85rem' }}>
                      ფაილის შერჩევა
                    </label>
                  </div>

                  {loadingFile && <p style={{ fontSize: '0.85rem', color: 'var(--primary)', textAlign: 'center' }}>ფაილი იკითხება და ტექსტი მუშავდება...</p>}
                  {errorMsg && <p style={{ fontSize: '0.85rem', color: 'var(--danger)', textAlign: 'center' }}>❌ {errorMsg}</p>}

                  <div className="divider-or">ან ჩაწერეთ ტექსტი</div>

                  <textarea 
                    className="input-field" 
                    rows="6" 
                    placeholder="ჩააკოპირეთ სასწავლო ტექსტი აქ..."
                    value={text}
                    onChange={e => setText(e.target.value)}
                    style={{ resize: 'none' }}
                  />
                  <button onClick={handleLoadText} className="btn-primary" style={{ width: '100%' }}>ტექსტის ჩატვირთვა</button>
                </div>
              ) : (
                <div className="loaded-document-card glass-panel">
                  <h3>მასალა ჩატვირთულია</h3>
                  <h4 style={{ fontSize: '0.9rem', color: 'var(--primary)', wordBreak: 'break-all', margin: '4px 0' }}>{fileName}</h4>
                  <p className="doc-meta">ზომა: {text.length} სიმბოლო</p>
                  
                  <div className="doc-actions-list">
                    <button className={`doc-action-btn ${activeTab === 'chat' ? 'active' : ''}`} onClick={() => setActiveTab('chat')}>RAG AI ასისტენტი</button>
                    <button className={`doc-action-btn ${activeTab === 'quiz' ? 'active' : ''}`} onClick={() => { setActiveTab('quiz'); if (quiz.length === 0) generateQuizData(); }}>ინტერაქტიული ქვიზი</button>
                    <button className={`doc-action-btn ${activeTab === 'podcast' ? 'active' : ''}`} onClick={() => { setActiveTab('podcast'); if (podcast.length === 0) generatePodcastData(); }}>სასწავლო პოდკასტი</button>
                  </div>

                  <button className="btn-secondary" style={{ width: '100%' }} onClick={() => { setIsLoaded(false); window.speechSynthesis.cancel(); }}>ახალი მასალის ჩატვირთვა</button>
                </div>
              )}
            </div>

            <div className="hub-right-panel">
              <div className="workspace-card glass-panel">
                {!isLoaded ? (
                  <p style={{ textAlign: 'center', color: 'var(--text-muted)', paddingTop: '100px' }}>გთხოვთ, ჯერ ჩატვირთოთ სასწავლო მასალა მარცხნივ სამუშაო სივრცის გასააქტიურებლად.</p>
                ) : (
                  <div>
                    {activeTab === 'chat' && (
                      <div>
                        <h3>RAG ჩატ-ასისტენტი</h3>
                        <div className="chat-messages-container" style={{ margin: '20px 0', minHeight: '200px' }}>
                          {messages.map((m, idx) => (
                            <div key={idx} className={`chat-bubble-row ${m.sender}`}>
                              <div className="chat-avatar">{m.sender === 'user' ? 'ს' : 'AI'}</div>
                              <div className="chat-bubble-text">{m.text}</div>
                            </div>
                          ))}
                        </div>
                        <form onSubmit={handleSendChat} className="chat-input-bar">
                          <input 
                            type="text" 
                            className="input-field" 
                            placeholder="დაუსვი კითხვა მასალიდან..."
                            value={input}
                            onChange={e => setInput(e.target.value)}
                          />
                          <button type="submit" className="btn-primary"><Icons.Send /></button>
                        </form>
                      </div>
                    )}

                    {activeTab === 'quiz' && (
                      <div>
                        <h3>ინტერაქტიული ქვიზები</h3>
                        <div style={{ margin: '20px 0' }}>
                          {quiz.map(q => (
                            <div key={q.id} style={{ marginBottom: '20px', padding: '16px', background: 'var(--bg-tertiary)', borderRadius: '12px' }}>
                              <h4>{q.question}</h4>
                              <div className="quiz-options-list">
                                {q.options.map((o, oIdx) => {
                                  const isSelected = answers[q.id] === o;
                                  const isCorrect = o === q.correctAnswer;
                                  let cl = '';
                                  if (isSelected) cl = 'selected';
                                  if (submitted) {
                                    if (isCorrect) cl = 'correct';
                                    else if (isSelected) cl = 'wrong';
                                  }

                                  return (
                                    <button 
                                      key={oIdx} 
                                      className={`quiz-option-btn ${cl}`}
                                      onClick={() => setAnswers({...answers, [q.id]: o})}
                                      disabled={submitted}
                                    >
                                      {o}
                                    </button>
                                  );
                                })}
                              </div>
                            </div>
                          ))}
                          
                          {!submitted ? (
                            <button onClick={submitQuiz} className="btn-primary" style={{ marginTop: '10px' }}>ტესტის დასრულება</button>
                          ) : (
                            <div style={{ background: '#f0fdf4', padding: '20px', borderRadius: '12px', textAlign: 'center' }}>
                              <h4>შედეგი: {score} / {quiz.length} ({Math.round(score/quiz.length*100)}%)</h4>
                              <button onClick={generateQuizData} className="btn-secondary" style={{ marginTop: '10px' }}>ახალი ტესტი</button>
                            </div>
                          )}
                        </div>
                      </div>
                    )}

                    {activeTab === 'podcast' && (
                      <div>
                        <h3>სასწავლო პოდკასტი</h3>
                        <div className="audio-visualizer" style={{ margin: '20px 0' }}>
                          <div className={`bar ${playing ? 'playing' : ''}`} style={{ height: '30px' }}></div>
                          <div className={`bar ${playing ? 'playing' : ''}`} style={{ height: '50px' }}></div>
                          <div className={`bar ${playing ? 'playing' : ''}`} style={{ height: '20px' }}></div>
                          <div className={`bar ${playing ? 'playing' : ''}`} style={{ height: '60px' }}></div>
                          <div className={`bar ${playing ? 'playing' : ''}`} style={{ height: '30px' }}></div>
                        </div>

                        <div className="audio-controls">
                          <button onClick={togglePlay} className="play-pause-btn">
                            {playing ? <Icons.Pause /> : <Icons.Play />}
                          </button>
                          <div>
                            <h4>საგანმანათლებლო პოდკასტი</h4>
                            <p>წამკითხველები: თამთა & გიორგი</p>
                          </div>
                        </div>

                        <div className="transcript-lines">
                          {podcast.map((p, idx) => (
                            <div key={idx} className={`transcript-line ${p.speaker === 'თამთა' ? 'tamta' : 'giorgi'} ${idx === currentLine ? 'active' : ''}`}>
                              <strong>{p.speaker}:</strong> {p.text}
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // COMPONENT: PROFILE SETTINGS
    // ==========================================
    function ProfileSettings({ user, onUpdate, apiKey, setApiKey, tasks }) {
      const [name, setName] = React.useState(user.name);
      const [email, setEmail] = React.useState(user.email);
      const [pace, setPace] = React.useState(user.pace || 'balanced');
      const [key, setKey] = React.useState(apiKey || '');
      const [saved, setSaved] = React.useState(false);

      const total = tasks.length;
      const completed = tasks.filter(t => t.done).length;
      const score = total > 0 ? Math.round((completed / total) * 100) : 0;

      const handleSave = (e) => {
        e.preventDefault();
        onUpdate({ name, email, pace });
        setApiKey(key);
        setSaved(true);
        setTimeout(() => setSaved(false), 2000);
      };

      return (
        <div className="settings-page-container animate-fade-in">
          <div className="page-header">
            <h1>პირადი პროფილის პარამეტრები</h1>
            <p className="subtitle">მართე შენი აკადემიური მონაცემები, სწავლის ტემპი და Gemini API გასაღები.</p>
          </div>

          <div className="settings-grid">
            <div className="settings-card glass-panel" style={{ background: 'white' }}>
              <h2>პროფილის რედაქტირება</h2>
              <form onSubmit={handleSave} className="settings-form">
                {saved && <div className="badge badge-success">ცვლილებები შენახულია!</div>}
                <div className="form-group">
                  <label>სახელი</label>
                  <input type="text" className="input-field" value={name} onChange={e => setName(e.target.value)} />
                </div>
                <div className="form-group">
                  <label>ელ-ფოსტა</label>
                  <input type="email" className="input-field" value={email} onChange={e => setEmail(e.target.value)} />
                </div>
                <div className="form-group">
                  <label>სწავლის ტემპი</label>
                  <div className="pace-options">
                    <button type="button" className={`pace-btn ${pace === 'casual' ? 'active' : ''}`} onClick={() => setPace('casual')}><strong>Casual</strong></button>
                    <button type="button" className={`pace-btn ${pace === 'balanced' ? 'active' : ''}`} onClick={() => setPace('balanced')}><strong>Balanced</strong></button>
                    <button type="button" className={`pace-btn ${pace === 'intensive' ? 'active' : ''}`} onClick={() => setPace('intensive')}><strong>Intensive</strong></button>
                  </div>
                </div>
                <div className="form-group">
                  <label>Gemini API Key</label>
                  <input 
                    type="password" 
                    className="input-field" 
                    placeholder="შეიყვანეთ Google AI Studio API key..."
                    value={key} 
                    onChange={e => setKey(e.target.value)} 
                  />
                  <p className="field-note">თუ გასაღები ცარიელია, აპლიკაცია მუშაობს სადემონსტრაციო (Mock) რეჟიმში.</p>
                </div>
                <button type="submit" className="btn-primary">ცვლილებების შენახვა</button>
              </form>
            </div>

            <div className="settings-card glass-panel" style={{ background: 'white' }}>
              <h2>რეალობის თრექერი</h2>
              <div className="disclaimer-alert">
                <p>⚠️ AI არის მხოლოდ დამხმარე ასისტენტი, პროგრესის თრექერი აჩვენებს მკაცრ რეალობას და შესრულებაზე პასუხისმგებელი თავად სტუდენტია.</p>
              </div>

              <div className="score-visualization-box">
                <div className="score-gauge-label">დისციპლინის ქულა</div>
                <div className="score-number">{score}/100</div>
                <div className="discipline-bar-bg">
                  <div 
                    className="discipline-bar-fill" 
                    style={{ 
                      width: `${score}%`, 
                      background: score >= 75 ? 'var(--success)' : score >= 40 ? 'var(--warning)' : 'var(--danger)' 
                    }}
                  />
                </div>
                <div className="score-stats-grid">
                  <div className="score-stat-cell"><strong>{total}</strong><span>დაგეგმილი</span></div>
                  <div className="score-stat-cell"><strong>{completed}</strong><span>შესრულებული</span></div>
                  <div className="score-stat-cell"><strong>{total - completed}</strong><span>შეუსრულებელი</span></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // COMPONENT: MAIN APP ORCHESTRATOR
    // ==========================================
    const DEFAULT_TASKS = [
      { id: 't1', text: 'წაიკითხე "ვეფხისტყაოსნის" პირველი თავი', priority: 'high', done: true },
      { id: 't2', text: 'შექმენი სასწავლო გეგმა AI Time Manager-ში', priority: 'medium', done: false },
      { id: 't3', text: 'ატვირთე სასწავლო მასალა (.txt) Study Hub-ში', priority: 'low', done: false }
    ];

    function App() {
      const [user, setUser] = React.useState(null);
      const [apiKey, setApiKey] = React.useState('');
      const [activePage, setActivePage] = React.useState('dashboard');
      const [tasks, setTasks] = React.useState(DEFAULT_TASKS);

      React.useEffect(() => {
        const u = localStorage.getItem('omnistudy_user');
        const k = localStorage.getItem('omnistudy_gemini_key');
        const t = localStorage.getItem('omnistudy_tasks');
        if (u) setUser(JSON.parse(u));
        if (k) setApiKey(k);
        if (t) setTasks(JSON.parse(t));
      }, []);

      const handleLogin = (userData) => {
        const u = { ...userData, pace: 'balanced' };
        setUser(u);
        setTasks(DEFAULT_TASKS);
        localStorage.setItem('omnistudy_user', JSON.stringify(u));
        localStorage.setItem('omnistudy_tasks', JSON.stringify(DEFAULT_TASKS));
      };

      const handleLogout = () => {
        setUser(null);
        setTasks([]);
        localStorage.clear();
        window.speechSynthesis.cancel();
      };

      const handleUpdate = (updatedFields) => {
        const u = { ...user, ...updatedFields };
        setUser(u);
        localStorage.setItem('omnistudy_user', JSON.stringify(u));
      };

      const handleSetApiKey = (k) => {
        setApiKey(k);
        localStorage.setItem('omnistudy_gemini_key', k);
      };

      const handleSetTasks = (t) => {
        setTasks(t);
        localStorage.setItem('omnistudy_tasks', JSON.stringify(t));
      };

      if (!user) {
        return <Landing onLogin={handleLogin} />;
      }

      return (
        <div className="app-container animate-fade-in">
          <Sidebar 
            activePage={activePage} 
            setActivePage={setActivePage} 
            user={user} 
            onLogout={handleLogout} 
          />
          <main className="content-area">
            {activePage === 'dashboard' && <Dashboard tasks={tasks} setTasks={handleSetTasks} apiKey={apiKey} />}
            {activePage === 'time-manager' && <TimeManager tasks={tasks} setTasks={handleSetTasks} apiKey={apiKey} academicPace={user.pace} />}
            {activePage === 'study-hub' && <StudyHub apiKey={apiKey} />}
            {activePage === 'settings' && (
              <ProfileSettings 
                user={user} 
                onUpdate={handleUpdate} 
                apiKey={apiKey} 
                setApiKey={handleSetApiKey} 
                tasks={tasks} 
              />
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

  </script>
</body>
</html>
